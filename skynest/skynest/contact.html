<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | SkyNest Co-Living Spaces</title>
<meta name="description" content="Send an enquiry to SkyNest. We reply within one working day.">
<link rel="stylesheet" href="style.css">
</head>
<body data-p="contact">
<div id="hdr"></div>
<main>
<div class="hero"><div class="w"><div class="ey">Get in touch</div><h1>Start your enquiry.</h1><p>Tell us what you need and we will reply within one working day.</p></div></div>
<section><div class="w grid g2" style="align-items:start">
<div class="ct"><h2>Talk to us</h2><p style="color:var(--mut);margin-top:10px">We help you pick the right space and move-in date.</p>
<ul><li>hello@skynestcoliving.sg</li><li>+65 6123 4567</li><li>Mon–Sat, 9am–6pm (SGT)</li></ul></div>
<form id="f"><label for="n">Full name</label><input id="n" required autocomplete="name">
<label for="e">Email</label><input id="e" type="email" required autocomplete="email">
<label for="ph">Phone (optional)</label><input id="ph" type="tel" autocomplete="tel">
<label for="pk">Package</label><select id="pk"></select>
<label for="d">Preferred move-in date</label><input id="d" type="date">
<label for="m">Message</label><textarea id="m"></textarea>
<div class="row" style="margin-top:18px"><button class="btn" type="submit">Send enquiry</button></div><p id="ok" role="status"></p></form></div></section>
</main>
<div id="ftr"></div>
<script src="site.js"></script>
</body>
</html>
